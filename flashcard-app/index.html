<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wortkarte">
  <title>Wortkarte — German Flashcards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div id="app" class="app">
    <header class="topbar">
      <button type="button" class="brand" id="brand-btn" aria-label="Go to home">
        <span class="brand-mark">W</span>
        <span class="brand-name">Wortkarte</span>
      </button>
      <nav class="nav" aria-label="Primary">
        <button type="button" class="nav-btn" data-view="home" id="nav-home">Home</button>
        <button type="button" class="nav-btn" data-view="study" id="nav-study">Study</button>
        <button type="button" class="nav-btn" data-view="browse" id="nav-browse">Browse</button>
      </nav>
    </header>

    <main id="main" class="main" aria-live="polite"></main>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
